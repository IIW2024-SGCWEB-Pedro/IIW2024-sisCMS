# ─────────────────────────────────────────────────────────────────────────────
# Etapa 4 — quem decide qual CMS sobe é a linha COMPOSE_PROFILES do .env:
#     COMPOSE_PROFILES=wordpress      ou      COMPOSE_PROFILES=joomla
# O banco não tem perfil, então sobe nos dois casos.
#
# Regra de indentação deste arquivo:
#   0 espaços  → name, services, volumes
#   2 espaços  → o nome de cada serviço (db, wordpress, joomla)
#   4 espaços  → as propriedades do serviço (image, ports, environment...)
#   6 espaços  → os itens dentro de uma propriedade
# ─────────────────────────────────────────────────────────────────────────────

name: cms-siscms

services:

  # ── Etapa 1 — Banco de dados (MariaDB) ───────────────────────────────────
  db:
    image: ${DB_IMAGE:-mariadb:11}
    container_name: cms-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-cms}
      MARIADB_USER: ${DB_USER:-cmsuser}
      MARIADB_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no arquivo .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?defina DB_ROOT_PASSWORD no .env}
    volumes:
      - dados-do-banco:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ── Etapa 2 — WordPress ──────────────────────────────────────────────────
  wordpress:
    profiles: ["wordpress"]
    image: ${WP_IMAGE:-wordpress:php8.3-apache}
    container_name: cms-wordpress
    restart: unless-stopped
    ports:
      - "${PORTA_WEB:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${DB_NAME:-cms}
      WORDPRESS_DB_USER: ${DB_USER:-cmsuser}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-0}
      WORDPRESS_CONFIG_EXTRA: |
        if (isset($$_SERVER['HTTP_HOST'])) {
            define('WP_HOME',    'https://' . $$_SERVER['HTTP_HOST']);
            define('WP_SITEURL', 'https://' . $$_SERVER['HTTP_HOST']);
        }
        $$_SERVER['HTTPS'] = 'on';
    volumes:
      - site-wordpress:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  # ── Etapa 3 — Joomla ─────────────────────────────────────────────────────
  joomla:
    profiles: ["joomla"]
    image: ${JOOMLA_IMAGE:-joomla:5-php8.3-apache}
    container_name: cms-joomla
    restart: unless-stopped
    ports:
      - "${PORTA_WEB:-8080}:80"
    environment:
      JOOMLA_DB_HOST: db
      JOOMLA_DB_NAME: ${DB_NAME:-cms}
      JOOMLA_DB_USER: ${DB_USER:-cmsuser}
      JOOMLA_DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - site-joomla:/var/www/html
    depends_on:
      db:
        condition: service_healthy

volumes:
  dados-do-banco:
  site-wordpress:
  site-joomla:
